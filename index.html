<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>10 Apps Hub</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-slate-950 text-slate-100"><main class="mx-auto max-w-7xl px-6 py-14"><p class="text-sm font-semibold tracking-widest text-indigo-300">TEN APP COLLECTION</p><h1 class="mt-3 text-4xl font-bold md:text-6xl">A practical browser toolkit.</h1><p class="mt-5 max-w-2xl text-lg text-slate-400">Ten polished, private-by-default tools. Their data lives in your browser.</p><div id="apps" class="mt-10 grid gap-5 sm:grid-cols-2 lg:grid-cols-3"></div></main><script>const A=[['01-kanban-board','Kanban Task Board','Organize priorities through a visual workflow.'],['02-markdown-editor','Markdown Editor','Write, preview and export Markdown notes.'],['03-expense-tracker','Expense Tracker','Track budget, spending and category totals.'],['04-weather-dashboard','Weather Dashboard','Search live conditions and a five-day outlook.'],['05-pomodoro-timer','Pomodoro Timer','Focus with configurable work and break sessions.'],['06-recipe-finder','Recipe Finder','Search recipes and scale serving sizes.'],['07-habit-tracker','Habit Tracker','Build daily streaks with a weekly matrix.'],['08-code-snippet-manager','Snippet Manager','Save, tag and copy useful code.'],['09-typing-speed-test','Typing Speed Test','Measure speed, accuracy and mistakes.'],['10-drawing-canvas','Drawing Canvas','Sketch, undo and download as PNG.']];apps.innerHTML=A.map((a,i)=>'<a href="apps/'+a[0]+'/" class="group rounded-2xl border border-slate-800 bg-slate-900 p-6 transition hover:-translate-y-1 hover:border-indigo-400"><span class="text-indigo-300">0'+(i+1)+'</span><h2 class="mt-5 text-xl font-bold group-hover:text-indigo-300">'+a[1]+'</h2><p class="mt-2 text-slate-400">'+a[2]+'</p><span class="mt-5 inline-block font-semibold text-indigo-300">Open app →</span></a>').join('')</script></body></html>
