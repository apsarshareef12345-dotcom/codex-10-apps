<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quick Cook</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <a href="../../index.html" class="back">← Back to app hub</a>

    <header class="hero">
      <div>
        <p>QUICK COOK</p>
        <h1>What can we cook today?</h1>
        <span>Choose a recipe, get ingredients, and cook it fast.</span>
      </div>
      <div class="food-art">🍳</div>
    </header>

    <section class="search-area">
      <input id="search" placeholder="Try: bread, tomato, pasta, noodles…">
      <button id="clearSearch">Show all recipes</button>
    </section>

    <section>
      <div class="title-row">
        <div>
          <p>QUICK RECIPES</p>
          <h2>Pick something yummy</h2>
        </div>
        <span id="count"></span>
      </div>

      <div id="recipeList" class="recipe-list"></div>
    </section>

    <section id="recipeDetail" class="detail hidden"></section>

    <section class="shopping-card">
      <div class="title-row">
        <div>
          <p>SHOPPING LIST</p>
          <h2>Things to buy</h2>
        </div>
        <button id="clearShopping" class="clear">Clear list</button>
      </div>

      <div id="shoppingList"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
