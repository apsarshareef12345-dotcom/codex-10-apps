<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SuperOne Notes</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="network" aria-hidden="true">
    <i></i><i></i><i></i><i></i>
  </div>

  <main class="app-shell">
    <header class="app-header">
      <div class="left-actions">
        <button id="downloadButton" class="primary">Download .md</button>
        <button id="sampleButton" class="secondary">Load example</button>
      </div>

      <a class="brand" href="../../index.html">
        <span>✦</span> SuperOne Notes
      </a>

      <div class="header-icons">
        <button>◉</button>
        <button>⌕</button>
        <button>♙</button>
      </div>
    </header>

    <section class="intro">
      <p class="eyebrow">YOUR CREATIVE SPACE</p>
      <h1>Ideas become awesome notes.</h1>
      <p>Write on the left and watch your note come alive on the right.</p>
    </section>

    <section class="workspace">
      <article class="editor-panel panel">
        <div class="panel-head">
          <div>
            <span class="dot purple"></span>
            <b>Markdown Editor</b>
          </div>

          <span id="editorStatus" class="saved">✓ Draft saved</span>
        </div>

        <div class="editor-wrap">
          <textarea
            id="source"
            spellcheck="true"
            placeholder="Start writing your idea..."
          ></textarea>
          <span class="code-icon">⌘</span>
        </div>

        <p class="hint">
          Try: <code># Title</code>
          <code>**bold**</code>
          <code>- list</code>
        </p>
      </article>

      <article class="preview-panel panel">
        <div class="panel-head">
          <div>
            <span class="dot blue"></span>
            <b>Rendered Preview</b>
          </div>

          <span id="previewStatus" class="saved">✓ Live preview</span>
        </div>

       <article id="preview" class="preview"></article>

<section class="history-panel">
  <div class="history-head">
    <div>
      <span class="history-dot">◷</span>
      <b>Recent notes</b>
    </div>

    <button id="clearHistoryButton" class="clear-history">
      Clear
    </button>
  </div>

  <div id="historyList" class="history-list"></div>
</section>
      </article>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
