<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expense Tracker</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><a href="../../">← Hub</a><h1>Expense Tracker</h1></header><main class="wrap"><form id="budgetForm" class="row card"><label>Monthly budget <input id="budget" type="number" min="0"></label><button>Save budget</button></form><section class="grid stats" style="margin:18px 0"><div class="card"><span class="muted">Budget</span><div id="b" class="stat"></div></div><div class="card"><span class="muted">Spent</span><div id="spent" class="stat"></div></div><div class="card"><span class="muted">Balance</span><div id="balance" class="stat"></div></div></section><section class="grid" style="grid-template-columns:minmax(250px,1fr) 2fr"><form class="card" id="form"><b>Add expense</b><p><input id="name" required placeholder="Description"></p><p><input id="amount" required type="number" min=".01" step=".01" placeholder="Amount"></p><p><select id="category"><option>Food</option><option>Transport</option><option>Shopping</option><option>Bills</option><option>Other</option></select></p><button>Add expense</button></form><div class="card"><b>Category spending</b><div id="chart"></div><div id="list"></div></div></section></main><script src="app.js"></script></body></html>
