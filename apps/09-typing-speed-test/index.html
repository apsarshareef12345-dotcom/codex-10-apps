<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Typing Speed Test</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><a href="../../">← Hub</a><h1>Typing Speed Test</h1></header><main class="wrap" style="max-width:900px"><div class="card"><p id="passage" class="passage"></p><textarea id="input" placeholder="Start typing here…" aria-label="Typing input"></textarea><p><button class="ghost" id="new">New passage</button></p></div><section class="grid scores" style="margin-top:18px"><div class="card"><span class="muted">WPM</span><div id="wpm" class="score">0</div></div><div class="card"><span class="muted">Accuracy</span><div id="accuracy" class="score">100%</div></div><div class="card"><span class="muted">Time</span><div id="time" class="score">0s</div></div></section></main><script src="app.js"></script></body></html>
