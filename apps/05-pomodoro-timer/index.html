<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pomodoro Timer</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><a href="../../">← Hub</a><h1>Pomodoro Timer</h1></header><main class="wrap" style="max-width:700px"><section class="card"><p id="mode" class="muted" style="text-align:center">Focus time</p><div id="clock" class="clock">25:00</div><div class="row" style="justify-content:center"><button id="start">Start</button><button class="ghost" id="reset">Reset</button></div></section><section class="grid settings" style="margin-top:18px"><label>Work minutes<input id="work" type="number" min="1" max="90"></label><label>Break minutes<input id="break" type="number" min="1" max="60"></label><label>Sessions done<div id="sessions" class="card">0</div></label></section><section class="card" style="margin-top:18px"><b>Session log</b><div id="log"></div></section></main><script src="app.js"></script></body></html>
