<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mission Control Kanban</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="space" aria-hidden="true">
    <span></span>
    <span></span>
  </div>

  <header class="topbar">
    <a href="../../index.html" class="back">← Space Station</a>

    <div>
      <p class="eyebrow">MISSION CONTROL</p>
      <h1>Kanban Task Board</h1>
    </div>

    <div class="progress">
      <span id="completedCount">0</span>
      <small>missions complete</small>
    </div>
  </header>

  <main class="page">
    <section class="hero">
      <div>
        <p class="eyebrow">PLAN • FOCUS • FINISH</p>
        <h2>Turn big jobs into small wins.</h2>
        <p>Drag each mission as you make progress. Everything is saved in this browser.</p>
      </div>

      <div class="orbit" aria-hidden="true">✦</div>
    </section>

    <form id="taskForm" class="task-form">
      <label class="sr-only" for="taskTitle">New task</label>

      <input
        id="taskTitle"
        required
        maxlength="120"
        placeholder="What is your next mission?"
      >

      <label class="sr-only" for="priority">Priority</label>

      <select id="priority">
        <option value="High">High priority</option>
        <option value="Medium" selected>Medium priority</option>
        <option value="Low">Low priority</option>
      </select>

      <button type="submit">+ Add mission</button>
    </form>

    <section id="board" class="board" aria-label="Task board"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
